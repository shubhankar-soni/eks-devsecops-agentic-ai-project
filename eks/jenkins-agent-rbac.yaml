apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-agent
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: jenkins-agent-cluster-role
rules:
  # Permissions to manage application deployments, services, pods, etc.
  - apiGroups: ["", "apps", "batch"]
    resources: ["pods", "pods/exec", "pods/log", "deployments", "services", "configmaps", "secrets", "namespaces"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-agent-cluster-role-binding
subjects:
  - kind: ServiceAccount
    name: jenkins-agent
    namespace: jenkins
roleRef:
  kind: ClusterRole
  name: jenkins-agent-cluster-role
  apiGroup: rbac.authorization.k8s.io